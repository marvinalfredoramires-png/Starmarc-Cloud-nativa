name: Build Starmarc APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Crear app nativa
        run: |
          npm install -g @capacitor/cli
          mkdir web
          echo '<h1>Starmarc Cloud Nativa - Copia GENERAL</h1>' > web/index.html
          echo '{"name":"starmarc","dependencies":{"@capacitor/core":"latest","@capacitor/android":"latest"}}' > package.json
          npm install
          npx cap init "Starmarc Cloud" com.starmarc.cloud --web-dir=web
          npx cap add android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Starmarc-Cloud-APK-NATIVA
          path: android/app/build/outputs/apk/debug/app-debug.apk
