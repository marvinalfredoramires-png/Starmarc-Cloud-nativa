name: Build Starmarc APK Real Nativa
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Clonar tu web real y hacer app nativa
        run: |
          npm i -g @capacitor/cli
          rm -rf web android node_modules package.json package-lock.json capacitor.config.*
          git clone https://github.com/marvinalfredoramires-png/Starmarc-Ops.git web-temp
          mkdir web
          cp -r web-temp/* web/ || cp -r web-temp/. web/
          ls web/
          echo '{"name":"starmarc","version":"1.0.0","dependencies":{"@capacitor/core":"^6.0.0","@capacitor/android":"^6.0.0"}}' > package.json
          npm install
          npx cap init "Starmarc Cloud" com.starmarc.cloud --web-dir=web
          npx cap add android
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.starmarc.cloud",
            "appName": "Starmarc Cloud",
            "webDir": "web",
            "bundledWebRuntime": false
          }
          EOF
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Starmarc-Cloud-NATIVA-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
