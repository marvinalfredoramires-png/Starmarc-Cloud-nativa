name: Build Starmarc APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Crear app nativa
        run: |
          npm i -g @capacitor/cli
          rm -rf web android node_modules package.json package-lock.json
          mkdir web
          echo '<h1>Starmarc Cloud Nativa</h1>' > web/index.html
          echo '{"name":"starmarc","version":"1.0.0","dependencies":{"@capacitor/core":"^6.0.0","@capacitor/android":"^6.0.0"}}' > package.json
          npm install
          npx cap init "Starmarc Cloud" com.starmarc.cloud --web-dir=web
          npx cap add android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Starmarc-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
